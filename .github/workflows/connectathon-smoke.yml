name: Connectathon smoke tests

on:
  push:
    branches:
      - connectathon/piqi-43
  pull_request:
    branches:
      - main

jobs:
  piqitt-connectathon-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile converter
        run: |
          python -m py_compile \
            scripts/fhir_convert_backend.py \
            scripts/fhir_convert.py

      - name: Run Connectathon converter test
        run: pytest -q tests/test_fhir_convert_cli.py
